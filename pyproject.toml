[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawbody"
version = "0.1.0+kiodream1"
description = "ClawBody - Give your OpenClaw/Codex subscription a physical robot body with Reachy Mini."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Tom", email = "tom@example.com"}
]
keywords = [
    "clawbody",
    "reachy-mini",
    "openclaw",
    "clawson",
    "robotics",
    "ai-assistant",
    "openai-realtime",
    "voice-conversation",
    "expressive-robot",
    "embodied-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
    # Optional OpenAI Realtime API path. Without OPENAI_API_KEY, ClawBody uses
    # the local OpenClaw gateway subscription bridge.
    "openai>=1.50.0",
    
    # Audio streaming
    "fastrtc>=0.0.17",
    "numpy",
    "scipy",
    
    # OpenClaw gateway client (WebSocket protocol)
    "websockets>=12.0",
    
    # Gradio UI
    "gradio>=4.0.0",
    
    # Environment
    "python-dotenv",
]

# Note: reachy-mini SDK must be installed separately from the robot or GitHub:
# pip install git+https://github.com/pollen-robotics/reachy_mini.git
# Or on the robot, it's pre-installed.

[project.optional-dependencies]
kiyo-voice = ["mlx-whisper>=0.4.3,<0.5", "silero-vad>=6.2,<7", "sounddevice>=0.5,<0.6"]
kiyo-calendar = ["google-auth-oauthlib>=1.2,<2"]
wireless = [
    "pygobject",
]
# YOLO-based face tracking (recommended - more accurate)
yolo_vision = [
    "opencv-python",
    "ultralytics",
    "supervision",
]
# MediaPipe-based face tracking (lighter weight alternative)
mediapipe_vision = [
    "mediapipe>=0.10.14",
]
# All vision options
all_vision = [
    "opencv-python",
    "ultralytics",
    "supervision",
    "mediapipe>=0.10.14",
]
# Legacy alias
vision = [
    "opencv-python",
    "ultralytics",
    "supervision",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[project.scripts]
kiyo = "kiyo.cli:main"
clawbody = "reachy_mini_openclaw.main:main"

[project.entry-points."reachy_mini_apps"]
clawbody = "reachy_mini_openclaw.main:ClawBodyApp"

[project.urls]
Homepage = "https://github.com/kiodreambau/clawbody"
Documentation = "https://github.com/kiodreambau/clawbody#readme"
Repository = "https://github.com/kiodreambau/clawbody"
Issues = "https://github.com/kiodreambau/clawbody/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.setuptools.package-data]
kiyo = ["SOUL.md"]
