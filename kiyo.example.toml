[kiyo]
backend = "hermes"
ask_interface_on_switch = true
# personality = "~/my-kiyo/SOUL.md" # default is src/kiyo/SOUL.md

[hermes]
url = "http://127.0.0.1:8642"

[openclaw]
agent = "main"

[openclaw_profiles]
# dreambau = "dreambau" # name of an independently configured OpenClaw CLI profile

[voice]
# Use dedicated, tool-free agent profiles for the shared room microphone.
hermes_profile = "kiyovoice"
openclaw_agent = "kiyovoice"

[reachy]
port = 8000
audio_device = "Reachy Mini Audio"
voice = "Anna"
language = "de"
whisper_model = "mlx-community/whisper-base-mlx"

[calendar]
id = "primary"
timezone = "Europe/Berlin"
